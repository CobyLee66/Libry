name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install .[dev]
      - name: Ruff
        run: ruff check libry tests
      - name: Pytest
        run: pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck deploy & scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck deploy/*.sh scripts/*.sh

  template-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Init a vault from template and lint it（自吃狗粮）
        run: |
          LIBRY_ADMIN_PASSWORD=ci-pass-12345 libry init /tmp/vault --no-git
          libry lint --root /tmp/vault
          libry index --root /tmp/vault
      - name: Lint the shipped template vault itself
        run: |
          python -m libry.__main__ lint --root libry/templates/vault
