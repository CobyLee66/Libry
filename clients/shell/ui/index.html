<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Libry</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --border: #e5e7eb; --text: #1f2329;
            --muted: #8a8f99; --primary: #2563eb; --danger: #dc2626; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      /* 安全区兜底：原生层未打 insets padding 时（viewport-fit=cover 已开）按 env() 让位 */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 32px 28px; width: min(420px, calc(100vw - 32px)); text-align: center;
    }
    .logo { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 12px 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
    .saved {
      font-size: 14px; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
      margin-bottom: 16px; word-break: break-all;
    }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); font-size: 14px; margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: var(--primary); }
    button {
      width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
      background: var(--primary); color: #fff; font-size: 14px; cursor: pointer;
    }
    button:hover { opacity: .92; }
    .ghost {
      background: none; border: 1px solid var(--border); color: var(--muted);
      margin-top: 10px;
    }
    .ghost:hover { color: var(--primary); border-color: var(--primary); }
    .hint { color: var(--muted); font-size: 12px; margin: 12px 0 0; min-height: 1.2em; }
    .err { color: var(--danger); }
    .portal-note {
      color: var(--text); font-size: 13px; line-height: 1.6; text-align: left;
      background: #fef3c7; border: 1px solid #fde68a; border-radius: 8px;
      padding: 8px 10px; margin: 0 0 16px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon.png" alt="Libry">
    <h1>Libry · 书阁</h1>
    <!-- 双语文案随系统语言切换：i18n 字典由服务端 Web 层提供，壳内只保留这两句话 -->
    <p class="sub" id="sub"></p>

    <div id="savedBox" class="hidden">
      <div class="saved" id="savedUrl"></div>
      <button id="btnContinue"></button>
      <button class="ghost" id="btnChange"></button>
      <p class="hint" id="cardHint"></p>
    </div>

    <!-- 离线门户：探测不可达时的包装界面（断网/宕机都不会露出系统错误页） -->
    <div id="offlineBox" class="hidden">
      <div class="saved" id="portalUrl"></div>
      <p class="portal-note" id="portalNote"></p>
      <p class="portal-note" id="portalStats"></p>
      <button id="btnReadOffline"></button>
      <button class="ghost" id="btnRetry"></button>
      <button class="ghost" id="btnPortalChange"></button>
    </div>

    <!-- 自动连接 splash：锁定不可点击，探测通过后立即跳转 -->
    <div id="connectBox" class="hidden">
      <div class="saved" id="connectUrl"></div>
      <p class="hint" id="connectHint"></p>
    </div>

    <div id="formBox" class="hidden">
      <input id="urlInput" type="url" spellcheck="false" autocapitalize="off"
             placeholder="https://kb.example.com">
      <button id="btnGo"></button>
      <p class="hint" id="formHint"></p>
    </div>
  </div>

  <!-- 离线门户统计直读壳 origin 镜像库（构建时由 clients/scripts/*.sh 从 libry/static 拷入 lib/） -->
  <script src="lib/offline.js"></script>
  <script>
    (function () {
      var zh = /^zh/i.test(navigator.language || '');
      var T = zh ? {
        sub: '输入你的 Libry 服务器地址，连接后即可阅读（支持离线缓存）',
        lastUsed: '上次连接',
        continueBtn: '连接',
        offlineNote: '服务器不可达 — 可直接连接使用离线缓存，或更换地址',
        connecting: '连接中…',
        portalNote: '当前无法连接服务器（设备可能处于离线状态）。已下载的离线内容仍可离线阅读。',
        portalStats: '壳内离线库：{n} 篇',
        portalEmpty: '暂无离线内容 — 请联网后在 Web 应用「离线管理」页下载。',
        readOffline: '进入离线阅读',
        retry: '重试连接',
        changeBtn: '更换服务器地址',
        goBtn: '连接服务器',
        hintBad: '地址无效 — 请输入服务器的 http(s) 地址'
      } : {
        sub: 'Enter your Libry server URL to start reading (offline caching supported)',
        lastUsed: 'Last connected to',
        continueBtn: 'Connect',
        offlineNote: 'Server unreachable — you can still connect to use the offline cache, or change the URL',
        connecting: 'Connecting…',
        portalNote: 'The server cannot be reached right now (you may be offline). Downloaded content is still available for offline reading.',
        portalStats: 'Offline library in shell: {n} document(s)',
        portalEmpty: 'Nothing downloaded yet — while online, download your library from the web app\'s offline manager.',
        readOffline: 'Open offline reader',
        retry: 'Retry connection',
        changeBtn: 'Change server URL',
        goBtn: 'Connect',
        hintBad: 'Invalid URL — enter the server\'s http(s) address'
      };
      var STORAGE_KEY = 'libry-server';
      // '1' = 用户在 Web 设置页主动断开过且尚未重新连接，启动时不自动连接
      var NOAUTO_KEY = 'libry-server-noauto';
      var $ = function (id) { return document.getElementById(id); };
      $('sub').textContent = T.sub;
      $('btnContinue').textContent = T.continueBtn;
      $('btnChange').textContent = T.changeBtn;
      $('btnGo').textContent = T.goBtn;
      $('btnReadOffline').textContent = T.readOffline;
      $('btnRetry').textContent = T.retry;
      $('btnPortalChange').textContent = T.changeBtn;
      document.title = zh ? 'Libry · 书阁' : 'Libry';

      function normalize(raw) {
        var u = (raw || '').trim().replace(/\/+$/, '');
        if (!u) return '';
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;  // 缺省协议自动补 https
        try {
          var parsed = new URL(u);
          if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
          return parsed.origin;  // Libry 部署在站点根，壳只连 origin
        } catch (e) { return ''; }
      }

      function showForm(preset, hint) {
        $('savedBox').classList.add('hidden');
        $('formBox').classList.remove('hidden');
        if (preset) $('urlInput').value = preset;
        var h = $('formHint');
        h.textContent = hint || '';
        h.className = 'hint' + (hint ? ' err' : '');
        $('urlInput').focus();
      }

      // 服务器可达性探测：icon.png 是免认证静态资源，加时间戳防缓存
      function probe(url, ok, fail) {
        var img = new Image();
        var settled = false;
        var timer = setTimeout(function () {
          if (!settled) { settled = true; fail(); }
        }, 4000);
        img.onload = function () { if (!settled) { settled = true; clearTimeout(timer); ok(); } };
        img.onerror = function () { if (!settled) { settled = true; clearTimeout(timer); fail(); } };
        img.src = url + '/icon.png?probe=' + Date.now();
      }

      function connect(url) {
        try {
          localStorage.setItem(STORAGE_KEY, url);
          localStorage.removeItem(NOAUTO_KEY);  // 主动连接即恢复自动模式
        } catch (e) { /* 存储不可用 */ }
        // 锁定界面：只显示不可点击的连接中状态，随后整页跳转
        $('savedBox').classList.add('hidden');
        $('formBox').classList.add('hidden');
        $('connectBox').classList.remove('hidden');
        $('connectUrl').textContent = url;
        $('connectHint').textContent = T.connecting;
        // 告知 Web 层壳首页地址（各平台 origin 不同，运行时自取），供设置页「断开并更换服务器」跳回
        var home = '';
        try { home = location.origin + '/'; } catch (e) { /* 取不到则退化为不带标记 */ }
        var target = url.replace(/\/+$/, '');
        location.replace(target + (home ? '/?_libryHome=' + encodeURIComponent(home) : ''));
      }

      function setOfflineNote() {
        var h = $('cardHint');
        h.textContent = T.offlineNote;
        h.className = 'hint';
      }

      // 上次连接卡片：knownOffline 为 true 时跳过探测直接显示离线提示
      function showSavedCard(url, knownOffline) {
        $('connectBox').classList.add('hidden');
        $('offlineBox').classList.add('hidden');
        $('formBox').classList.add('hidden');
        $('savedBox').classList.remove('hidden');
        $('savedUrl').textContent = T.lastUsed + '：' + saved;
        if (knownOffline) { setOfflineNote(); return; }
        // 后台探测可达性：失败仅补充提示（离线时仍可直接连接，Service Worker 会回放缓存内容）
        probe(url, function () {}, setOfflineNote);
      }

      // 锁定连接中界面（探测期间与跳转前展示）
      function showSplash(url) {
        $('savedBox').classList.add('hidden');
        $('formBox').classList.add('hidden');
        $('offlineBox').classList.add('hidden');
        $('connectBox').classList.remove('hidden');
        $('connectUrl').textContent = url;
        $('connectHint').textContent = T.connecting;
      }

      // 离线门户：探测不可达时停在壳内（跳转会落到 WebView 系统错误页）。
      // 离线阅读由壳内本地模式 Web 应用承担——镜像库在在线时经 bridge.html 增量同步到壳 origin。
      function showOfflinePortal(url) {
        $('savedBox').classList.add('hidden');
        $('formBox').classList.add('hidden');
        $('connectBox').classList.add('hidden');
        $('offlineBox').classList.remove('hidden');
        $('portalUrl').textContent = T.lastUsed + '：' + url;
        $('portalNote').textContent = T.portalNote;
        refreshPortalStats();
      }

      // 门户展示壳库文档数（同 origin 直读 IndexedDB）；空库禁用离线入口
      function refreshPortalStats() {
        var btn = $('btnReadOffline');
        var stats = $('portalStats');
        if (!window.LibryOffline) { stats.textContent = ''; return; }
        LibryOffline.currentUser().then(function (u) {
          if (!u) { stats.textContent = T.portalEmpty; btn.disabled = true; return; }
          return LibryOffline.docStats(u).then(function (s) {
            stats.textContent = T.portalStats.replace('{n}', s.count);
            btn.disabled = !s.count;
          });
        }).catch(function () { stats.textContent = ''; });
      }

      $('btnReadOffline').onclick = function () { location.href = 'webapp/index.html#/list'; };
      $('btnRetry').onclick = function () {
        if (!saved) return;
        showSplash(saved);
        probe(saved, function () { connect(saved); }, function () { showOfflinePortal(saved); });
      };
      $('btnPortalChange').onclick = function () { showForm(saved); };

      $('btnContinue').onclick = function () { if (saved) connect(saved); };
      $('btnChange').onclick = function () { showForm(saved); };

      var saved = null;
      var noauto = false;
      try {
        saved = localStorage.getItem(STORAGE_KEY);
        noauto = localStorage.getItem(NOAUTO_KEY) === '1';
      } catch (e) { /* 存储不可用 */ }

      if (new URLSearchParams(location.search).get('_libryDisconnected') === '1') {
        // 从 Web 设置页「断开并更换服务器」跳回：记住地址但不再自动连，直接进入选服务器表单
        try { localStorage.setItem(NOAUTO_KEY, '1'); } catch (e) { /* 存储不可用 */ }
        showForm('', '');
      } else if (saved && !noauto) {
        // 自动连接：探测可达立即跳转远端（在线=最新网页）；不可达进离线门户（不裸跳——
        // 跳转会落到 WebView 系统错误页；断网时由壳内离线阅读器承担阅读）。
        showSplash(saved);
        probe(saved, function () { connect(saved); }, function () { showOfflinePortal(saved); });
      } else if (saved) {
        showSavedCard(saved);
      } else {
        showForm('', '');
      }

      function submit() {
        var url = normalize($('urlInput').value);
        if (!url) { showForm($('urlInput').value, T.hintBad); return; }
        connect(url);
      }
      $('btnGo').onclick = submit;
      $('urlInput').addEventListener('keydown', function (e) {
        if (e.isComposing || e.keyCode === 229) return;  // IME 组词中的 Enter 不是提交
        if (e.key === 'Enter') submit();
      });
    })();
  </script>
</body>
</html>
