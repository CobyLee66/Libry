<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Libry</title>
  <style>
    /* 与壳连接页同一视觉体系：断网时用户从门户进入，观感连续 */
    :root { --bg: #f6f7f9; --card: #fff; --border: #e5e7eb; --text: #1f2329;
            --muted: #8a8f99; --primary: #2563eb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .top {
      position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
    }
    .top .title { font-weight: 600; font-size: 15px; flex: 1;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .who { color: var(--muted); font-size: 12px; flex: 0 0 auto; }
    .ghost-btn {
      flex: 0 0 auto; border: 1px solid var(--border); background: none; color: var(--muted);
      border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer;
    }
    .ghost-btn:hover { color: var(--primary); border-color: var(--primary); }
    .list { max-width: 720px; margin: 0 auto; padding: 16px 12px 40px; }
    .empty-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 28px 20px; text-align: center; margin-top: 10vh;
    }
    .empty-card p { margin: 0 0 8px; font-size: 15px; }
    .empty-card .hint { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.6; }
    .item {
      display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 8px;
    }
    .item:hover { border-color: var(--primary); }
    .item .t { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      flex: 0 0 auto; font-size: 11px; color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px;
    }
    .doc { max-width: 760px; margin: 0 auto; padding: 4px 14px 60px; }
    .md { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 18px 16px; font-size: 15px; line-height: 1.75; overflow-wrap: break-word; }
    .md img { max-width: 100%; height: auto; }
    .md h1, .md h2, .md h3 { line-height: 1.4; }
    .md pre { overflow-x: auto; background: var(--bg); padding: 10px; border-radius: 8px; font-size: 13px; }
    .md code { background: var(--bg); border-radius: 4px; padding: 1px 4px; font-size: 90%; }
    .md pre code { background: none; padding: 0; }
    .md blockquote { margin: 0; padding: 2px 12px; border-left: 3px solid var(--border); color: var(--muted); }
    .md table { border-collapse: collapse; width: 100%; }
    .md th, .md td { border: 1px solid var(--border); padding: 6px 8px; font-size: 13px; }
    .pn { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
    .pn a {
      flex: 1; text-decoration: none; color: var(--primary); font-size: 13px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pn a:last-child { text-align: right; }
    .pn span { flex: 1; }
  </style>
</head>
<body>
  <div id="view"></div>
  <!-- 离线库与镜像桥共用同一份引擎侧脚本（构建时由 clients/scripts/*.sh 从 libry/static 拷入 lib/） -->
  <script src="lib/offline.js"></script>
  <script>
  (function () {
    'use strict';
    var zh = /^zh/i.test(navigator.language || '');
    var T = zh ? {
      title: 'Libry · 离线阅读',
      back: '← 返回',
      openApp: '完整应用',
      empty: '暂无离线内容',
      emptyHint: '联网时在 Web 应用「离线管理」页下载后，<br>这里即可离线阅读（含图片）。',
    } : {
      title: 'Libry · Offline Reader',
      back: '← Back',
      openApp: 'Full app',
      empty: 'Nothing downloaded yet',
      emptyHint: 'While online, download your library from the web app\'s<br>"Offline reading" page — it becomes readable here, images included.',
    };
    var el = document.getElementById('view');
    var user = '';
    var docs = [];  // {file, title, type, sortTs}，列表与上下篇存在性判断共用

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }
    function hasDoc(file) {
      return docs.some(function (d) { return d.file === file; });
    }
    function shellHome() {
      // 返回壳连接页：有历史（从门户进入）就回退，否则直达
      if (history.length > 1) history.back();
      else location.href = 'index.html';
    }

    async function renderList() {
      var rows = user ? await LibryOffline.listDocs(user).catch(function () { return []; }) : [];
      docs = rows.map(function (r) {
        var meta = (r.payload && r.payload.meta) || {};
        return {
          file: r.file,
          title: meta.title || r.file,
          type: meta.type || '',
          sortTs: String(meta.created || meta.updated || ''),
        };
      }).sort(function (a, b) {
        return (b.sortTs || '').localeCompare(a.sortTs || '')
          || a.title.localeCompare(b.title, 'zh');
      });
      var html = '<header class="top">'
        + '<button class="ghost-btn" id="backBtn">' + esc(T.openApp) + '</button>'
        + '<span class="title">' + esc(T.title) + '</span>'
        + (user ? '<span class="who">' + esc(user) + '</span>' : '')
        + '</header><main class="list">';
      if (!docs.length) {
        html += '<div class="empty-card"><p>' + esc(T.empty) + '</p>'
          + '<p class="hint">' + T.emptyHint + '</p></div>';
      } else {
        docs.forEach(function (d, i) {
          html += '<a class="item" href="#" data-i="' + i + '">'
            + '<span class="t">' + esc(d.title) + '</span>'
            + (d.type ? '<span class="badge">' + esc(d.type) + '</span>' : '')
            + '</a>';
        });
      }
      html += '</main>';
      el.innerHTML = html;
      el.querySelectorAll('.item').forEach(function (a) {
        a.addEventListener('click', function (ev) {
          ev.preventDefault();
          renderDoc(docs[Number(a.dataset.i)].file);
        });
      });
      document.getElementById('backBtn').addEventListener('click', shellHome);
      window.scrollTo(0, 0);
    }

    async function renderDoc(file) {
      var rec = await LibryOffline.getDoc(user, file).catch(function () { return null; });
      if (!rec) { renderList(); return; }
      var payload = rec.payload || {};
      var meta = payload.meta || {};
      var html = '<header class="top">'
        + '<button class="ghost-btn" id="backBtn">' + esc(T.back) + '</button>'
        + '<span class="title">' + esc(meta.title || file) + '</span>'
        + '</header><main class="doc"><article class="md">' + (payload.html || '') + '</article>'
        + '<nav class="pn">';
      var idx = -1;
      docs.forEach(function (d, i) { if (d.file === file) idx = i; });
      if (payload.prev && hasDoc(payload.prev.file)) {
        html += '<a href="#" data-i="' + docs.findIndex(function (d) { return d.file === payload.prev.file; }) + '">← '
          + esc(payload.prev.title) + '</a>';
      } else { html += '<span></span>'; }
      if (payload.next && hasDoc(payload.next.file)) {
        html += '<a href="#" data-i="' + docs.findIndex(function (d) { return d.file === payload.next.file; }) + '">'
          + esc(payload.next.title) + ' →</a>';
      } else { html += '<span></span>'; }
      html += '</nav></main>';
      el.innerHTML = html;
      // 站内图片替换为镜像 dataURL（键与 extractAssetPaths 一致：pathname + search）
      var imgs = el.querySelectorAll('img[src]');
      for (var k = 0; k < imgs.length; k++) {
        var raw = imgs[k].getAttribute('src') || '';
        if (raw.indexOf('/raw/assets/') !== 0) continue;
        try {
          var u = new URL(raw, 'http://x/');
          var dataURL = await LibryOffline.getAsset(user, u.pathname + u.search);
          if (dataURL) imgs[k].src = dataURL;
        } catch (e) { /* 非法 src 保持原样（裂图） */ }
      }
      document.getElementById('backBtn').addEventListener('click', renderList);
      el.querySelectorAll('.pn a').forEach(function (a) {
        a.addEventListener('click', function (ev) {
          ev.preventDefault();
          renderDoc(docs[Number(a.dataset.i)].file);
        });
      });
      window.scrollTo(0, 0);
    }

    LibryOffline.currentUser().then(function (u) {
      user = u || '';
      renderList();
    }).catch(function () { renderList(); });
  })();
  </script>
</body>
</html>
