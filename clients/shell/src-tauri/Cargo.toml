[package]
name = "libry-shell"
version = "0.1.0"
description = "Libry（书阁）多端薄壳：加载自托管 Libry 服务器的 WebView 容器，离线能力由 Web 层（Service Worker）承担"
authors = ["CobyLee66"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "libry_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
